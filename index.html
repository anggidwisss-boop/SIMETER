<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5ed7"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>SIMETER</title></head><body>
<header><b>SIMETER</b><small>Sistem Informasi Pemeliharaan Meter</small></header><main>
<section class="hero"><h1>Pemeliharaan Meter</h1><span id="online">● Online</span></section>
<nav><button class="tab active" data-t="input">Pemeliharaan</button><button class="tab" data-t="meter">Data Meter</button><button class="tab" data-t="history">Riwayat</button><button class="tab" data-t="settings">Pengaturan</button></nav>
<section id="input" class="panel active"><form id="form"><h2>Form Pemeliharaan</h2>
<button type="button" id="scan">📷 SCAN BARCODE / QR METER</button><button type="button" id="stop" class="hide">Tutup Scanner</button><div id="reader" class="hide"></div><p id="scanMsg"></p>
<label>ID Pelanggan<input id="id" required placeholder="Otomatis dari master meter"></label><label>Nomor Meter<input id="meter" required></label>
<div id="customer" class="customer hide"><b id="name">-</b><span id="address">-</span></div>
<label>Jenis Pemeliharaan<select id="jenis" required><option value="">Pilih</option><option>Pemeriksaan meter</option><option>Pembersihan meter</option><option>Pengecekan terminal</option><option>Pengecekan segel</option><option>Penggantian meter</option><option>Lainnya</option></select></label>
<label>Kondisi Meter<select id="kondisi" required><option value="">Pilih</option><option>Baik</option><option>Perlu perhatian</option><option>Rusak</option></select></label>
<label>Stand Meter<input id="stand" type="number" min="0" step=".01"></label><label>Keterangan<textarea id="ket"></textarea></label>
<div class="gps"><div><b>GPS</b><span id="gps">Belum diambil</span></div><button type="button" id="getgps">Ambil GPS</button></div>
<label>Foto Meter<input id="foto" type="file" accept="image/*" capture="environment"></label><img id="preview" class="preview hide">
<button class="primary" type="submit">Simpan Pemeliharaan</button><p id="msg"></p></form></section>
<section id="meter" class="panel"><div class="card"><h2>Data Meter</h2><button id="refreshM">Refresh</button><input id="searchM" placeholder="Cari..."><div id="meters"></div></div></section>
<section id="history" class="panel"><div class="card"><h2>Riwayat</h2><button id="refreshH">Refresh</button><input id="searchH" placeholder="Cari..."><div id="hist"></div></div></section>
<section id="settings" class="panel"><div class="card"><h2>Pengaturan</h2><label>URL Web App Google Apps Script<input id="api" placeholder="https://script.google.com/macros/s/.../exec"></label><button class="primary" id="save">Simpan URL</button><button id="test">Tes Koneksi</button><p id="apiMsg"></p></div></section>
</main><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="app.js"></script></body></html>
